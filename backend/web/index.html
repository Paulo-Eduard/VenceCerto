<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VenceCerto — demonstração</title>
<style>
  :root { --brand:#1F6B3A; --bg:#F6F7F5; --line:#E3E6E1; --ink:#1B1F1C; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:16px 24px; }
  header h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; font-size:13px; opacity:.85; }
  main { max-width:960px; margin:24px auto; padding:0 16px; display:grid; gap:16px; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; }
  h2 { margin:0 0 12px; font-size:16px; color:var(--brand); }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; align-items:end; }
  label { font-size:12px; display:grid; gap:4px; }
  input { padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  button { background:var(--brand); color:#fff; border:0; border-radius:6px; padding:9px 14px; cursor:pointer; font:inherit; }
  pre { background:var(--bg); border-radius:6px; padding:10px; margin:12px 0 0; white-space:pre-wrap; min-height:20px; }
  .err { color:#B3261E; }
</style>
</head>
<body>
<header><h1>VenceCerto</h1><p>Demonstração das regras de negócio — sem banco de dados e sem login.</p></header>
<main>

<section><h2>1. Situação de validade do lote</h2>
<form data-url="/api/v1/lots/classify">
  <label>Validade<input name="expiry_date" type="date" required></label>
  <label>Quantidade<input name="quantity_available" type="number" min="0" value="10" required></label>
  <label>Próximo (dias)<input name="near_days" type="number" min="0" value="30"></label>
  <label>Urgente (dias)<input name="urgent_days" type="number" min="0" value="7"></label>
  <button>Classificar</button>
</form><pre></pre></section>

<section><h2>2. Baixa PVPS (primeiro que vence, primeiro que sai)</h2>
<form data-url="/api/v1/stock/pvps" data-pvps>
  <label>Lote A: validade<input name="d1" type="date" required></label>
  <label>Lote A: qtd<input name="q1" type="number" min="0" value="10"></label>
  <label>Lote B: validade<input name="d2" type="date" required></label>
  <label>Lote B: qtd<input name="q2" type="number" min="0" value="10"></label>
  <label>Quantidade a baixar<input name="quantity" type="number" min="1" value="12"></label>
  <button>Simular baixa</button>
</form><pre></pre></section>

<section><h2>3. Recomendação de promoção</h2>
<form data-url="/api/v1/promotions/recommend">
  <label>Custo (R$)<input name="cost_price" type="number" step="0.01" value="5.00"></label>
  <label>Venda (R$)<input name="sale_price" type="number" step="0.01" value="10.00"></label>
  <label>Dias restantes<input name="days_left" type="number" value="5"></label>
  <label>Quantidade<input name="quantity" type="number" value="20"></label>
  <button>Recomendar</button>
</form><pre></pre></section>

<section><h2>4. Sugestão de reposição</h2>
<form data-url="/api/v1/insights/reorder" data-sales>
  <label>Vendas diárias (separadas por vírgula, mín. 7)<input name="daily_sales" value="10,12,9,11,10,13,12,10"></label>
  <label>Estoque atual<input name="current_stock" type="number" value="25"></label>
  <label>Prazo de entrega (dias)<input name="lead_time_days" type="number" value="2"></label>
  <label>Estoque mínimo<input name="min_stock" type="number" value="5"></label>
  <label>Estoque máximo<input name="max_stock" type="number" value="100"></label>
  <button>Sugerir</button>
</form><pre></pre></section>

</main>
<script>
const today = new Date(); const iso = d => d.toISOString().slice(0,10);
const plus = n => iso(new Date(today.getTime() + n*864e5));
document.querySelector('[name=expiry_date]').value = plus(5);
document.querySelector('[name=d1]').value = plus(20);
document.querySelector('[name=d2]').value = plus(6);

function body(form) {
  const f = Object.fromEntries(new FormData(form));
  if (form.hasAttribute('data-pvps')) {
    const rec = iso(today);
    return { quantity: +f.quantity, lots: [
      { id: 1, expiry_date: f.d1, received_date: rec, quantity_available: +f.q1 },
      { id: 2, expiry_date: f.d2, received_date: rec, quantity_available: +f.q2 } ] };
  }
  if (form.hasAttribute('data-sales')) {
    return { ...Object.fromEntries(Object.entries(f).map(([k,v]) => [k, k==='daily_sales' ? v : +v])),
             daily_sales: f.daily_sales.split(',').map(s => parseInt(s.trim(), 10)) };
  }
  const out = {};
  for (const [k, v] of Object.entries(f)) {
    out[k] = (k === 'expiry_date' || k === 'cost_price' || k === 'sale_price') ? v : +v;
  }
  return out;
}

document.querySelectorAll('form').forEach(form => form.addEventListener('submit', async e => {
  e.preventDefault();
  const pre = form.nextElementSibling; pre.className = ''; pre.textContent = 'Calculando...';
  try {
    const r = await fetch(form.dataset.url, { method:'POST', headers:{'Content-Type':'application/json'},
                                              body: JSON.stringify(body(form)) });
    const j = await r.json();
    if (!r.ok) { pre.className = 'err'; pre.textContent = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail, null, 2); return; }
    pre.textContent = JSON.stringify(j, null, 2);
  } catch (err) { pre.className = 'err'; pre.textContent = 'Falha de conexão: ' + err.message; }
}));
</script>
</body>
</html>
