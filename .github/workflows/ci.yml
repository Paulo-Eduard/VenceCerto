# CI inicial: cobre somente o que existe hoje (nucleo de dominio do backend).
# Etapas de frontend, integracao com PostgreSQL, Docker build, Trivy e CD ainda nao implementadas.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
