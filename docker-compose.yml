# ATENCAO: ESTE ARQUIVO AINDA NAO SOBE O SISTEMA COMPLETO.
# Os servicos abaixo referenciam partes ainda nao implementadas: ./frontend, app.main (FastAPI),
# alembic (migrations) e app.tasks.run_scheduler. Somente `db` e `nginx` sao funcionais isoladamente.
# Estado real em DEVELOPMENT_STATUS.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  scheduler:
    build: ./backend
    command: python -m app.tasks.run_scheduler
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks: [internal]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [backend, frontend]
    networks: [internal]
    restart: unless-stopped

volumes:
  pgdata:

networks:
  internal:
